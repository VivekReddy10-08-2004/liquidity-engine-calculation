services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dlr
      POSTGRES_USER: dlr
      POSTGRES_PASSWORD: dlr_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dlr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlr -d dlr"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dlr_postgres:
